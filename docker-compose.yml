version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/eventually}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      PORT: ${PORT:-3001}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "node dist/scripts/seed.js && node dist/main"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
